<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B3A · 富泰邨 ↔ 深圳灣口岸</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --line: #26303a;
    --text: #e6edf3;
    --muted: #8b98a5;
    --accent: #ffd400;
    --accent-dim: #a88b00;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: radial-gradient(1200px 700px at 50% -10%, #1b2735 0%, var(--bg) 55%);
    color: var(--text);
    font-family: "PingFang HK", "Microsoft JhengHei", "Noto Sans TC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    width: min(600px, 100%);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 26px 26px 18px;
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
  }
  header { display: flex; align-items: center; gap: 14px; }
  .badge {
    background: var(--accent);
    color: #111;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: .5px;
    padding: 8px 14px;
    border-radius: 10px;
    line-height: 1;
    flex: none;
  }
  .route { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .route strong { color: var(--text); font-size: 15px; display: block; }
  .arrow { color: var(--accent); }

  .service { margin-top: 22px; border-top: 1px solid var(--line); padding-top: 18px; }
  .service h2 {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .2px;
  }
  .service .meta { margin-top: 3px; font-size: 12px; color: var(--muted); }
  .board { margin-top: 12px; display: grid; gap: 10px; }

  .row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: baseline;
    gap: 12px;
    padding: 13px 16px;
    background: #0f141a;
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .row .when { font-size: 13px; color: var(--muted); }
  .row .mins {
    font-variant-numeric: tabular-nums;
    font-size: 28px;
    font-weight: 750;
    letter-spacing: -0.5px;
    color: var(--accent);
    min-width: 108px;
    text-align: right;
    white-space: nowrap;
  }
  .row .mins.text { font-size: 18px; letter-spacing: 0; }
  .row .mins small { font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 4px; }
  .row.now .mins { color: #7ee787; }
  .rmk { grid-column: 1 / -1; font-size: 12px; color: #d29922; margin-top: -6px; }
  .empty {
    padding: 22px 16px;
    text-align: center;
    color: var(--muted);
    border: 1px dashed var(--line);
    border-radius: 12px;
    font-size: 13.5px;
    line-height: 1.7;
  }
  .note { margin-top: 10px; font-size: 11.5px; color: #6f7d8a; line-height: 1.6; }

  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    border-top: 1px solid var(--line);
    margin-top: 20px;
    padding-top: 12px;
    font-size: 12px;
    color: var(--muted);
  }
  footer .status { display: flex; align-items: center; gap: 7px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #3fb950; flex: none; }
  .dot.err { background: #f85149; }
  .dot.load { background: var(--accent); animation: pulse 1s infinite ease-in-out; }
  @keyframes pulse { 50% { opacity: .25; } }
  button {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    flex: none;
    font-family: inherit;
  }
  button:hover { border-color: var(--accent-dim); color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .source { margin-top: 10px; font-size: 11px; color: #5d6b78; text-align: center; }
</style>
</head>
<body>
<main class="card">
  <header>
    <div class="badge">B3A</div>
    <div class="route">
      <strong>富泰邨 <span class="arrow">↔</span> 深圳灣口岸</strong>
      城巴 · 雙向
    </div>
  </header>

  <section class="service" id="service-out">
    <h2>富泰邨 <span class="arrow">→</span> 深圳灣口岸</h2>
    <div class="meta">上車站：富泰邨（青山公路）</div>
    <div class="board" aria-live="polite"></div>
  </section>

  <section class="service" id="service-in">
    <h2>深圳灣口岸 <span class="arrow">→</span> 富泰邨</h2>
    <div class="meta">上車站：深圳灣口岸總站</div>
    <div class="board" aria-live="polite"></div>
    <div class="note">回程班次終點為山景邨；富泰邨是過關後第一站，車程約 8–10 分鐘。</div>
  </section>

  <footer>
    <div class="status"><span class="dot load" id="dot"></span><span id="status">連線中…</span></div>
    <button id="refresh" type="button">重新整理</button>
  </footer>
  <div class="source">資料來源：城巴開放數據（DATA.GOV.HK）· 每 30 秒自動更新</div>
</main>

<script>
(function () {
  const CO = "CTB";
  const ROUTE = "B3A";
  const REFRESH_MS = 30000;

  const SERVICES = [
    { el: "#service-out", stop: "003261", dir: "O" },  // 富泰邨 -> 深圳灣口岸
    { el: "#service-in",  stop: "003208", dir: "I" }   // 深圳灣口岸 -> 富泰邨
  ];

  const statusEl = document.getElementById("status");
  const dot = document.getElementById("dot");
  const refreshBtn = document.getElementById("refresh");

  const hhmm = new Intl.DateTimeFormat("en-GB", {
    hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Hong_Kong"
  });

  function setStatus(text, kind) {
    statusEl.textContent = text;
    dot.className = "dot" + (kind ? " " + kind : "");
  }

  function fmtLeft(etaIso) {
    const diffMs = new Date(etaIso).getTime() - Date.now();
    const mins = Math.round(diffMs / 60000);
    if (mins <= 0 && diffMs > -60000) return { text: "即將到站", isText: true, now: true };
    if (mins <= 0) return { text: "已開出", isText: true, now: false };
    return { text: String(mins), isText: false, now: mins <= 1 };
  }

  function rowHtml(item) {
    const left = fmtLeft(item.eta);
    const clock = hhmm.format(new Date(item.eta));
    const remark = (item.rmk_tc || item.rmk_en || "").trim();
    const seqLabel = ["第 1 班", "第 2 班", "第 3 班"][item.eta_seq - 1];
    return `
      <div class="row${left.now ? " now" : ""}">
        <div class="when">${clock} 開出${seqLabel ? ` · ${seqLabel}` : ""}</div>
        <div class="mins${left.isText ? " text" : ""}">${left.text}${left.isText ? "" : "<small>分鐘</small>"}</div>
        ${remark ? `<div class="rmk">${remark}</div>` : ""}
      </div>`;
  }

  function renderBoard(container, rows) {
    if (!rows.length) {
      container.innerHTML = '<div class="empty">暫時沒有班次資料。<br>深夜或服務暫停時，這是正常情況。</div>';
      return;
    }
    container.innerHTML = rows.map(rowHtml).join("");
  }

  async function loadService(svc) {
    const container = document.querySelector(svc.el + " .board");
    try {
      const res = await fetch(
        `https://rt.data.gov.hk/v2/transport/citybus/eta/${CO}/${svc.stop}/${ROUTE}`,
        { cache: "no-store" }
      );
      if (!res.ok) throw new Error("HTTP " + res.status);
      const payload = await res.json();
      const rows = (payload.data || [])
        .filter(d => d.dir === svc.dir && d.eta)
        .sort((a, b) => new Date(a.eta) - new Date(b.eta))
        .slice(0, 3);
      renderBoard(container, rows);
      return true;
    } catch (err) {
      container.innerHTML = `<div class="empty">未能連線至城巴數據。<br><small>${String(err.message || err)}</small></div>`;
      return false;
    }
  }

  async function load() {
    refreshBtn.disabled = true;
    setStatus("更新中…", "load");
    const results = await Promise.all(SERVICES.map(loadService));
    const ok = results.filter(Boolean).length;
    const now = hhmm.format(new Date());
    if (ok === SERVICES.length) {
      setStatus("更新於 " + now + " · 每 30 秒自動更新", "");
    } else if (ok > 0) {
      setStatus("部分線路更新失敗 · 30 秒後重試", "err");
    } else {
      setStatus("更新失敗 · 30 秒後重試", "err");
    }
    refreshBtn.disabled = false;
  }

  refreshBtn.addEventListener("click", load);
  load();
  setInterval(load, REFRESH_MS);
})();
</script>
</body>
</html>
