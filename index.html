<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>B3A · 富泰邨 ↔ 深圳灣口岸</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --line: #26303a;
    --text: #e6edf3;
    --muted: #8b98a5;
    --accent: #ffd400;
    --accent-dim: #a88b00;
    --pink: #f3b8c0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    background:
      radial-gradient(900px 420px at 50% -8%, #2b1d27 0%, rgba(13,17,23,0) 60%),
      var(--bg);
    color: var(--text);
    font-family: "PingFang HK", "Microsoft JhengHei", "Noto Sans TC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 12px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
  }
  .card {
    margin: auto;
    width: 100%;
    max-width: 520px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
  }

  /* ── 標題列 ── */
  .topbar { display: flex; align-items: center; gap: 12px; }
  .badge {
    position: relative;
    background: var(--accent);
    color: #111;
    font-weight: 800;
    font-size: 19px;
    letter-spacing: .5px;
    padding: 7px 12px;
    border-radius: 9px;
    line-height: 1.1;
    flex: none;
  }
  /* 兔耳：呼應桜島麻衣 */
  .badge::before, .badge::after {
    content: "";
    position: absolute;
    top: -9px;
    width: 9px;
    height: 16px;
    background: linear-gradient(180deg, #fff 0%, #fff 52%, #f7ccd6 53%, #f7ccd6 100%);
    border: 1px solid #e9bfc8;
    border-radius: 60% 60% 42% 42%;
    transform-origin: bottom center;
  }
  .badge::before { left: 7px; transform: rotate(-14deg); }
  .badge::after { left: 19px; transform: rotate(14deg); }
  .head-copy { min-width: 0; }
  .head-copy h1 {
    margin: 0;
    font-size: 17px;
    line-height: 1.3;
    font-weight: 750;
    letter-spacing: .2px;
  }
  .head-copy h1 .arrow { color: var(--accent); }
  .head-copy p { margin: 2px 0 0; font-size: 11.5px; color: var(--muted); }

  /* ── 人物插畫 ── */
  .hero {
    position: relative;
    margin: 13px 0 0;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--line);
    aspect-ratio: 16 / 7.6;
    max-height: 220px;
    background: #f6e9ec;
    box-shadow: 0 12px 34px rgba(243,184,192,.07);
  }
  .hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 24%;
    display: block;
  }
  .hero figcaption {
    position: absolute;
    left: 10px;
    bottom: 10px;
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: #fff;
    background: rgba(13,17,23,.58);
    border: 1px solid rgba(255,255,255,.18);
    padding: 5px 9px;
    border-radius: 999px;
    backdrop-filter: blur(6px);
  }
  .hero figcaption svg { width: 12px; height: 12px; flex: none; }
  svg.bunny { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .name-tag {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 2;
    writing-mode: vertical-rl;
    background: rgba(255,253,250,.92);
    color: #8f2d43;
    font-family: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", "MS Mincho", serif;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: .2em;
    padding: 9px 5px;
    border-radius: 8px;
    border: 1px solid rgba(143,45,67,.28);
    box-shadow: 0 4px 14px rgba(0,0,0,.16);
  }
  /* ── 麻衣每日寄語 ── */
  .mai-greet {
    position: relative;
    margin: 12px 2px 0;
    padding: 11px 13px 12px;
    background: #1a1f27;
    border: 1px solid rgba(243,184,192,.26);
    border-radius: 12px;
  }
  .mai-greet::before {
    content: "";
    position: absolute;
    top: -6px;
    left: 24px;
    width: 11px;
    height: 11px;
    background: #1a1f27;
    border-left: 1px solid rgba(243,184,192,.26);
    border-top: 1px solid rgba(243,184,192,.26);
    transform: rotate(45deg);
  }
  .mai-who { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
  .mai-who svg { width: 13px; height: 13px; flex: none; color: var(--pink); }
  .mai-name { font-size: 11px; font-weight: 600; letter-spacing: .08em; color: #e9a8b6; }
  .mai-day {
    margin-left: auto;
    font-size: 9.5px;
    color: var(--muted);
    border: 1px solid rgba(139,152,165,.3);
    border-radius: 999px;
    padding: 1px 7px;
    line-height: 1.5;
  }
  .mai-text { margin: 0; font-size: 12.5px; line-height: 1.75; color: #f0d3d9; }

  /* ── 班次 ── */
  .service { margin-top: 16px; border-top: 1px solid rgba(243,184,192,.17); padding-top: 14px; }
  .service h2 {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .2px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }
  .service h2 .arrow { color: var(--accent); }
  .service h2 .sakura { width: 14px; height: 14px; flex: none; color: var(--pink); }
  .service .meta { margin-top: 3px; font-size: 11.5px; color: var(--muted); }
  .board { margin-top: 10px; display: grid; gap: 8px; }

  .row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: baseline;
    gap: 10px;
    padding: 12px 14px;
    background: #0f141a;
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .row .when {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
    min-width: 0;
  }
  .row .mins {
    font-variant-numeric: tabular-nums;
    font-size: 30px;
    font-weight: 750;
    letter-spacing: -0.5px;
    color: var(--accent);
    min-width: 88px;
    text-align: right;
    white-space: nowrap;
    line-height: 1.1;
  }
  .row .mins.text { font-size: 16px; letter-spacing: 0; }
  .row .mins small { font-size: 12px; font-weight: 600; color: var(--muted); margin-left: 3px; }
  .row.now { border-color: rgba(126,231,135,.45); }
  .row.now .mins { color: #7ee787; }
  .rmk { grid-column: 1 / -1; font-size: 12px; color: #d29922; margin-top: -4px; }
  .empty {
    padding: 18px 14px;
    text-align: center;
    color: var(--muted);
    border: 1px dashed var(--line);
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.7;
  }
  .note { margin-top: 9px; font-size: 11px; color: #6f7d8a; line-height: 1.6; }

  footer {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px 12px;
    border-top: 1px solid var(--line);
    margin-top: 16px;
    padding-top: 11px;
    font-size: 11.5px;
    color: var(--muted);
  }
  footer .status { display: flex; align-items: center; gap: 7px; flex: 1 1 auto; min-width: 0; }
  footer .status span:last-child { overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #3fb950; flex: none; }
  .dot.err { background: #f85149; }
  .dot.load { background: var(--accent); animation: pulse 1s infinite ease-in-out; }
  @keyframes pulse { 50% { opacity: .25; } }
  button {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 9px 14px;
    min-height: 40px;
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
    flex: none;
  }
  button:hover { border-color: var(--accent-dim); color: var(--accent); }
  button:active { background: rgba(255,212,0,.08); }
  button:disabled { opacity: .5; cursor: default; }
  .source { margin-top: 9px; font-size: 10.5px; color: #5d6b78; text-align: center; }

  /* ── 小螢幕微調 ── */
  @media (max-width: 430px) {
    body { padding: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
    .card { border-radius: 16px; padding: 0 13px 12px; }
    .topbar { padding-top: 13px; }
    .badge { font-size: 17px; padding: 6px 10px; }
    .head-copy h1 { font-size: 15.5px; }
    .hero { margin-top: 11px; aspect-ratio: 16 / 8; }
    .row { padding: 11px 12px; gap: 8px; }
    .row .mins { font-size: 27px; min-width: 80px; }
    .service h2 { font-size: 14px; }
    footer { font-size: 11px; }
  }
  @media (max-width: 340px) {
    .head-copy h1 { font-size: 14.5px; }
    .row .when { font-size: 11px; }
    .row .mins { font-size: 24px; min-width: 72px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .dot.load { animation: none; }
  }
</style>
</head>
<body>
<main class="card">
  <header class="topbar">
    <span class="badge">B3A</span>
    <div class="head-copy">
      <h1>富泰邨 <span class="arrow">↔</span> 深圳灣口岸</h1>
      <p>城巴 · 實時班次 · 每 30 秒更新</p>
    </div>
  </header>

  <figure class="hero">
    <img src="character.jpg" alt="B3A 路線人物插畫">
    <span class="name-tag">桜島麻衣</span>
    <figcaption>
      <svg class="bunny" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.2 9.4C6.6 7 6.1 4.2 7 3.5c.9-.6 2.2 1.4 3 3.6"/><path d="M15.8 9.4c1.6-2.4 2.1-5.2 1.2-5.9-.9-.6-2.2 1.4-3 3.6"/><path d="M12 21c-3.5 0-5.8-2.3-5.8-5.2C6.2 12.1 8.7 9 12 9s5.8 3.1 5.8 6.8C17.8 18.7 15.5 21 12 21Z"/><circle cx="9.9" cy="14.2" r=".7" fill="currentColor" stroke="none"/><circle cx="14.1" cy="14.2" r=".7" fill="currentColor" stroke="none"/></svg>
      B3A 實時到站
    </figcaption>
  </figure>
  <aside class="mai-greet" aria-label="桜島麻衣今日寄語">
    <div class="mai-who">
      <svg class="bunny" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.2 9.4C6.6 7 6.1 4.2 7 3.5c.9-.6 2.2 1.4 3 3.6"/><path d="M15.8 9.4c1.6-2.4 2.1-5.2 1.2-5.9-.9-.6-2.2 1.4-3 3.6"/><path d="M12 21c-3.5 0-5.8-2.3-5.8-5.2C6.2 12.1 8.7 9 12 9s5.8 3.1 5.8 6.8C17.8 18.7 15.5 21 12 21Z"/><circle cx="9.9" cy="14.2" r=".7" fill="currentColor" stroke="none"/><circle cx="14.1" cy="14.2" r=".7" fill="currentColor" stroke="none"/></svg>
      <span class="mai-name">桜島麻衣</span>
      <span class="mai-day">今日</span>
    </div>
    <p class="mai-text" id="mai-text"></p>
  </aside>

  <section class="service" id="service-out">
    <h2>
      <svg class="sakura" viewBox="0 0 100 100" aria-hidden="true"><g fill="currentColor"><ellipse cx="50" cy="24" rx="11" ry="20"/><ellipse cx="50" cy="24" rx="11" ry="20" transform="rotate(72 50 50)"/><ellipse cx="50" cy="24" rx="11" ry="20" transform="rotate(144 50 50)"/><ellipse cx="50" cy="24" rx="11" ry="20" transform="rotate(216 50 50)"/><ellipse cx="50" cy="24" rx="11" ry="20" transform="rotate(288 50 50)"/><circle cx="50" cy="50" r="7"/></g></svg>
      富泰邨 <span class="arrow">→</span> 深圳灣口岸
    </h2>
    <div class="meta">上車站：富泰邨（青山公路）</div>
    <div class="board" aria-live="polite"></div>
  </section>

  <section class="service" id="service-in">
    <h2>
      <svg class="sakura" viewBox="0 0 100 100" aria-hidden="true"><g fill="currentColor"><ellipse cx="50" cy="24" rx="11" ry="20"/><ellipse cx="50" cy="24" rx="11" ry="20" transform="rotate(72 50 50)"/><ellipse cx="50" cy="24" rx="11" ry="20" transform="rotate(144 50 50)"/><ellipse cx="50" cy="24" rx="11" ry="20" transform="rotate(216 50 50)"/><ellipse cx="50" cy="24" rx="11" ry="20" transform="rotate(288 50 50)"/><circle cx="50" cy="50" r="7"/></g></svg>
      深圳灣口岸 <span class="arrow">→</span> 富泰邨
    </h2>
    <div class="meta">上車站：深圳灣口岸總站</div>
    <div class="board" aria-live="polite"></div>
    <div class="note">回程班次終點為山景邨；富泰邨是過關後第一站，車程約 8–10 分鐘。</div>
  </section>

  <footer>
    <div class="status"><span class="dot load" id="dot"></span><span id="status">連線中…</span></div>
    <button id="refresh" type="button">重新整理</button>
  </footer>
  <div class="source">資料來源：城巴開放數據（DATA.GOV.HK）</div>
</main>

<script>
(function () {
  const CO = "CTB";
  const ROUTE = "B3A";
  const REFRESH_MS = 30000;

  const SERVICES = [
    { el: "#service-out", stop: "003261", dir: "O" },  // 富泰邨 -> 深圳灣口岸
    { el: "#service-in",  stop: "003208", dir: "I" }   // 深圳灣口岸 -> 富泰邨
  ];

  const statusEl = document.getElementById("status");
  const dot = document.getElementById("dot");
  const refreshBtn = document.getElementById("refresh");

  const hhmm = new Intl.DateTimeFormat("en-GB", {
    hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Hong_Kong"
  });

  // 麻衣的每日寄語：依香港日期輪換，同一天所有人看到同一句
  const GREETINGS = [
    "「…別誤會，我只是剛好看到班次而已。」",
    "「早點出門，就不用跑得那麼難看了。」",
    "「趕時間的時候，更要看清班次。」",
    "「證件帶好了嗎？別到了關口才翻袋。」",
    "「人多就站穩點，別只顧著看手機。」",
    "「天氣轉涼了，外套記得帶。」",
    "「不是特意提醒你，只是順口說一句：車快到了。」",
    "「錯過一班就等下一班，慌什麼。」",
    "「…有我在，你不用一直盯著時間。」",
    "「排隊的時候，耐心一點。」",
    "「今天也平安出門，平安回來。」",
    "「累了就早點回家，別硬撐。」",
    "「遲到可不是什麼值得驕傲的事。」",
    "「路線我幫你看過了，放心走吧。」",
    "「別光顧著聊天，車是不會等你的。」",
    "「過關前先確認班次，總沒壞處。」",
    "「這種事還要我提醒你嗎？…算了。」",
    "「回來的時候，也記得看最後一班。」",
    "「風大的話，帽子戴好。」",
    "「你安全到達，我就放心了。」"
  ];

  function hkDayNumber() {
    try {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Hong_Kong",
        year: "numeric", month: "2-digit", day: "2-digit"
      }).formatToParts(new Date());
      const val = type => Number(parts.find(p => p.type === type).value);
      return Math.floor(Date.UTC(val("year"), val("month") - 1, val("day")) / 86400000);
    } catch (e) {
      return Math.floor(Date.now() / 86400000);
    }
  }

  function renderGreeting() {
    const el = document.getElementById("mai-text");
    if (el) el.textContent = GREETINGS[hkDayNumber() % GREETINGS.length];
  }
  renderGreeting();

  function setStatus(text, kind) {
    statusEl.textContent = text;
    dot.className = "dot" + (kind ? " " + kind : "");
  }

  function fmtLeft(etaIso) {
    const diffMs = new Date(etaIso).getTime() - Date.now();
    const mins = Math.round(diffMs / 60000);
    if (mins <= 0 && diffMs > -60000) return { text: "即將到站", isText: true, now: true };
    if (mins <= 0) return { text: "已開出", isText: true, now: false };
    return { text: String(mins), isText: false, now: mins <= 1 };
  }

  function rowHtml(item) {
    const left = fmtLeft(item.eta);
    const clock = hhmm.format(new Date(item.eta));
    const remark = (item.rmk_tc || item.rmk_en || "").trim();
    const seqLabel = ["第 1 班", "第 2 班", "第 3 班"][item.eta_seq - 1];
    return `
      <div class="row${left.now ? " now" : ""}">
        <div class="when">${clock} 開出${seqLabel ? ` · ${seqLabel}` : ""}</div>
        <div class="mins${left.isText ? " text" : ""}">${left.text}${left.isText ? "" : "<small>分鐘</small>"}</div>
        ${remark ? `<div class="rmk">${remark}</div>` : ""}
      </div>`;
  }

  function renderBoard(container, rows) {
    if (!rows.length) {
      container.innerHTML = '<div class="empty">暫時沒有班次資料。<br>深夜或服務暫停時，這是正常情況。</div>';
      return;
    }
    container.innerHTML = rows.map(rowHtml).join("");
  }

  async function loadService(svc) {
    const container = document.querySelector(svc.el + " .board");
    try {
      const res = await fetch(
        `https://rt.data.gov.hk/v2/transport/citybus/eta/${CO}/${svc.stop}/${ROUTE}`,
        { cache: "no-store" }
      );
      if (!res.ok) throw new Error("HTTP " + res.status);
      const payload = await res.json();
      const rows = (payload.data || [])
        .filter(d => d.dir === svc.dir && d.eta)
        .sort((a, b) => new Date(a.eta) - new Date(b.eta))
        .slice(0, 3);
      renderBoard(container, rows);
      return true;
    } catch (err) {
      container.innerHTML = `<div class="empty">未能連線至城巴數據。<br><small>${String(err.message || err)}</small></div>`;
      return false;
    }
  }

  async function load() {
    renderGreeting();
    refreshBtn.disabled = true;
    setStatus("更新中…", "load");
    const results = await Promise.all(SERVICES.map(loadService));
    const ok = results.filter(Boolean).length;
    const now = hhmm.format(new Date());
    if (ok === SERVICES.length) {
      setStatus("更新於 " + now + " · 每 30 秒更新", "");
    } else if (ok > 0) {
      setStatus("部分線路更新失敗 · 30 秒後重試", "err");
    } else {
      setStatus("更新失敗 · 30 秒後重試", "err");
    }
    refreshBtn.disabled = false;
  }

  refreshBtn.addEventListener("click", load);
  load();
  setInterval(load, REFRESH_MS);
})();
</script>
</body>
</html>
